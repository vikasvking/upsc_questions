development:
  refresh_leaderboard:
    class: RefreshLeaderboardJob
    schedule: every 10 minutes
  finish_expired_attempts:
    class: FinishExpiredAttemptsJob
    schedule: every 5 minutes

production:
  refresh_leaderboard:
    class: RefreshLeaderboardJob
    schedule: every 10 minutes
  finish_expired_attempts:
    class: FinishExpiredAttemptsJob
    schedule: every 5 minutes
  # Push notifications (see PushNotifier); nothing is sent until FIREBASE_CREDENTIALS is set
  results_released_notifications:
    class: ResultsReleasedNotificationJob
    schedule: every 5 minutes
  daily_practice_reminder:
    class: DailyPracticeReminderJob
    schedule: "0 19 * * * Asia/Kolkata"
  clear_solid_queue_finished_jobs:
    class: ClearFinishedJobsJob # was a command; a class lets Admin → Background work switch it off
    schedule: every hour at minute 12
